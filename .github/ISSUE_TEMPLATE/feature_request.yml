name: Feature request
description: Suggest an idea for telepath
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        telepath stays small and calm on purpose. Please read what's out of scope in CONTRIBUTING.md first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you picture it working, and whether it should be a setting in telepath.properties. Sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
  - type: checkboxes
    id: scope
    attributes:
      label: Fit with telepath
      options:
        - label: This doesn't add recommendation rows, ads, tracking, an account, or a third-party library.
          required: true
        - label: I'd like to build this myself (please wait for a reply before starting).