name: Bug report
description: Something in telepath doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please check Troubleshooting in the README first. Many Home button problems are solved there.
        Leave out anything private: your TV's address, account names, and what you watch.
  - type: input
    id: device
    attributes:
      label: TV or streaming device
      description: Brand and model, for example "Sony BRAVIA K-55XR70" or "Chromecast with Google TV (4K)".
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: Settings → System → About → Android TV OS version.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: telepath version
      description: Settings → Apps → telepath shows it (for example 1.0).
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Where did your APK come from?
      options:
        - A release of this project
        - My fork's GitHub Actions build
        - I built it on my computer
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead. Include the exact text of any message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Home settings
        2. Select ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Photo or video
      description: A photo of the screen or a short video helps a lot. Drag files here.