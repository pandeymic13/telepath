# telepath settings
# =======================
# The defaults your telepath is built with. Change them here (in your fork), or copy only the lines you
# want to change into telepath.local.properties next to this file: that file is git-ignored and its values win.
# Build again after a change (see README.md). The build stops with a clear message if a value isn't valid.
#
# Most of these are first-run defaults: once installed, you can change them on the TV in Home settings, and a
# new build doesn't overwrite what you chose there. Full reference: docs/CUSTOMIZING.md

# --- The app --------------------------------------------------------------------------------------------------------

# Android package ID. Use your own (for example io.github.yourname.home) to install your build next to another one.
app.id=dev.aster.home

# Your project's web page. telepath shows it as a QR code where it offers help with the Home button.
# Empty: Plume Launcher's guide.
project.url=

# --- Home screen ----------------------------------------------------------------------------------------------------

# Favourites on the dock, left to right (Android package names). Apps that aren't installed are skipped. Every
# other app is in All apps, where holding OK on an app adds it to the favourites.
home.favourites=com.netflix.ninja,com.google.android.youtube.tv,com.amazon.amazonvideo.livingroom,com.disney.disneyplus,in.startv.hotstar,com.apple.atve.androidtv.appletv,com.spotify.tv.android,com.plexapp.android

# --- Inputs (on the widgets page, below the dock) -------------------------------------------------------------------

# The HDMI port shown first and always lit: your console or set-top box. 0: none, every port in number order.
inputs.primary.port=1
# Its name on the tile. Empty: the name its device gives over HDMI-CEC, else the TV's name for the port.
inputs.primary.name=
# Its icon: auto (from the name), xbox, playstation, nintendoswitch, appletv, settop, playback or hdmi.
inputs.primary.icon=auto

# --- Weather --------------------------------------------------------------------------------------------------------
# Also where sunrise and sunset are worked out for the automatic theme and the mood colours.
# Empty: found from the TV's internet address (ipwho.is). On the TV: Home settings > Widgets > Weather location.
# Example:
#   weather.city=Lisbon
#   weather.latitude=38.7223
#   weather.longitude=-9.1393
weather.city=
weather.latitude=
weather.longitude=

# --- Watchlist widget -----------------------------------------------------------------------------------------------

# Up to five Yahoo Finance symbols, for example AAPL,^GSPC,RELIANCE.NS (NIFTY and SENSEX mean those indices).
# A share without its exchange, such as RELIANCE, is looked up on the TV and saved with it (RELIANCE.NS).
# Empty: the watchlist is off and nothing is requested. On the TV: Home settings > Widgets > Watchlist symbols.
watchlist.symbols=

# --- Up next: the sports line beside the clock ----------------------------------------------------------------------

# Show the line at all (it can also be turned off on the TV).
upnext.enabled=true
# Formula 1 qualifying, sprint and race sessions.
upnext.f1=true
# Semi-finals and final of the UEFA Champions League, and of the FIFA World Cup in its tournament years.
upnext.championsLeague=true
upnext.worldCup=true
# Teams to follow: TheSportsDB team ID, a colon and the name to show, separated by commas. Find a team's ID in
# its page address on https://www.thesportsdb.com (/team/133664-bayern-munich is 133664). Example:
#   upnext.teams=133664:FC Bayern Munich,137143:India
upnext.teams=

# --- Theme ----------------------------------------------------------------------------------------------------------

# auto (light from sunrise to sunset, dark from sunset to sunrise), light or dark. Changeable on the TV.
theme.mode=auto
# Mood colours over the wallpaper: weather (time of day and weather), time (time of day only) or off.
theme.mood=weather

# Colours are #RRGGBB, or #AARRGGBB with the opacity first (00 clear to FF solid). Pairs are top,bottom gradients.
# Day: frosted white glass with ink text.
theme.day.text=#14171B
theme.day.textSecondary=#A314171B
theme.day.textTertiary=#7314171B
theme.day.divider=#2214171B
theme.day.ground=#F2F4F6
theme.day.frost=#8CF4F6F8
theme.day.glass=#A8FFFFFF,#94F7F8FA
theme.day.glassRim=#C7FFFFFF
theme.day.glassFocused=#F7FFFFFF,#F0FFFFFF
theme.day.glassFocusedRim=#FFFFFF

# Night: smoky glass with soft white text.
theme.night.text=#F4F6F8
theme.night.textSecondary=#B3F4F6F8
theme.night.textTertiary=#80F4F6F8
theme.night.divider=#26FFFFFF
theme.night.ground=#06080B
theme.night.frost=#8C06080B
theme.night.glass=#A6262D36,#99161B22
theme.night.glassRim=#24FFFFFF
theme.night.glassFocused=#E0343C47,#D9222932
theme.night.glassFocusedRim=#80FFFFFF

# A focused tile turns solid in both themes, so focus reads from across the room: its fill, and its text and icon.
theme.focus=#FAFFFFFF
theme.focusText=#14171B

# Mood colours: the tint over the wallpaper in each part of the day, top,middle,bottom of the screen. Keep the
# opacity low (under 66): it's a wash over your photo. Weather turns these greyer or bluer on its own.
mood.dawn=#32FF9E7A,#1AFFC4A0,#2CE88BA8
mood.day=#168CC2FF,#00FFFFFF,#0C8CC2FF
mood.golden=#2CFFA040,#1AFFB860,#2EFF8C30
mood.sunset=#46FF5A3C,#2CFF7E46,#40F2553A
mood.dusk=#465B3FA0,#247A4E9E,#382A2C6E
mood.night=#3A0C1F52,#1810275C,#34081633

# --- Scripts only (scripts/*.ps1; the app ignores these) ------------------------------------------------------------

# Your TV's address for adb, for example 192.168.1.20 (port 5555 if none is given). Best set in
# telepath.local.properties. Empty: the scripts use the one device adb is connected to.
tv.address=
# The PC folder Sync-Wallpapers.ps1 copies to the TV's slideshow. Relative paths start at this folder.
wallpapers.folder=wallpapers
